name: CI - Docs and tools

on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-docs-tools-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    name: Docs and tools / detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.paths.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          base="$BASE_SHA"
          head="$HEAD_SHA"
          git fetch --no-tags origin "$base" "$head" 2>/dev/null || true
          if git rev-parse "${base}^{commit}" >/dev/null 2>&1 && git rev-parse "${head}^{commit}" >/dev/null 2>&1; then
            files="$(git diff --name-only "$base" "$head")"
          else
            files="$(git diff --name-only HEAD^ HEAD)"
          fi
          changed=false
          while IFS= read -r file; do
            case "$file" in
              docs/*|tools/*|.github/*|README.md|CONTRIBUTING.md|SECURITY.md|CHANGELOG.md|.pre-commit-config.yaml|.secrets.baseline|pyproject.toml|uv.lock)
                changed=true
                ;;
            esac
          done <<< "$files"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

  test:
    name: Docs and tools / repository checks
    needs: detect
    if: needs.detect.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.9"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.0"
          cache: npm
          cache-dependency-path: console/package-lock.json
      - run: npm --prefix console ci
      - run: uv sync --locked
      - run: uv run pytest tools/ci/tests/test_checks.py -q
      - run: python3 tools/ci/check_docs.py
      - run: python3 tools/ci/check_size.py
      - run: python3 tools/ci/check_notebooks.py
      - run: python3 tools/ci/check_context_refs.py
      - run: uv run pre-commit run --all-files

  status:
    name: Docs and tools / status
    needs:
      - detect
      - test
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - if: ${{ needs.detect.outputs.changed == 'true' && needs.test.result != 'success' }}
        run: exit 1
