name: CI - Console

on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-console-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    name: Console / detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.paths.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          base="$BASE_SHA"
          head="$HEAD_SHA"
          git fetch --no-tags origin "$base" "$head" 2>/dev/null || true
          if git rev-parse "${base}^{commit}" >/dev/null 2>&1 && git rev-parse "${head}^{commit}" >/dev/null 2>&1; then
            files="$(git diff --name-only "$base" "$head")"
          else
            files="$(git diff --name-only HEAD^ HEAD)"
          fi
          changed=false
          while IFS= read -r file; do
            case "$file" in
              console/*|.github/workflows/ci-console.yml)
                changed=true
                ;;
            esac
          done <<< "$files"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

  test:
    name: Console / lint test and build
    needs: detect
    if: needs.detect.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.0"
          cache: npm
          cache-dependency-path: console/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - run: npm run storybook:build
      - name: Check design tokens
        run: python3 ../tools/ci/check_tokens.py --root ..
      - name: Check contrast
        run: python3 ../tools/ci/check_contrast.py --root ..
      - name: Check production theme build
        run: python3 ../tools/ci/check_theme_build.py --dist dist

  status:
    name: Console / status
    needs:
      - detect
      - test
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - if: ${{ needs.detect.outputs.changed == 'true' && needs.test.result != 'success' }}
        run: exit 1
