name: verdict-local

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:17.12}
    restart: unless-stopped
    command:
      - postgres
      - -c
      - hba_file=/etc/verdict-pg_hba.conf
      - -c
      - listen_addresses=*
    environment:
      TZ: UTC
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      VERDICT_OWNER_PASSWORD: ${VERDICT_OWNER_PASSWORD}
      VERDICT_APP_PASSWORD: ${VERDICT_APP_PASSWORD}
      VERDICT_WORKER_PASSWORD: ${VERDICT_WORKER_PASSWORD}
      KEYCLOAK_PASSWORD: ${KEYCLOAK_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../bootstrap/bootstrap.sh:/docker-entrypoint-initdb.d/00-verdict-bootstrap.sh:ro
      - ../bootstrap/bootstrap.sql:/bootstrap/bootstrap.sql:ro
      - ../bootstrap/pg_hba.conf:/etc/verdict-pg_hba.conf:ro
    networks:
      - verdict_local
    mem_limit: ${POSTGRES_MAX_MEMORY:-1g}
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d postgres && PGPASSWORD="$${VERDICT_APP_PASSWORD}" psql -h 127.0.0.1 -U verdict_app -d verdict -tAc "SELECT 1" | grep -q 1
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  redis:
    image: ${REDIS_IMAGE:-redis:8.10.3}
    restart: unless-stopped
    environment:
      TZ: UTC
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_MAXMEMORY: ${REDIS_MAXMEMORY:-256mb}
    command:
      - sh
      - -ec
      - exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD" --maxmemory "$$REDIS_MAXMEMORY" --maxmemory-policy noeviction
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - verdict_local
    mem_limit: ${REDIS_MAX_MEMORY:-256m}
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  kafka:
    image: ${KAFKA_IMAGE:-apache/kafka:4.1.2}
    hostname: kafka
    restart: unless-stopped
    environment:
      TZ: UTC
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-MkU3OEVBNTcwNTJENDM2Qk}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://host.docker.internal:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MIN_IN_SYNC_REPLICAS: 1
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "127.0.0.1:${KAFKA_HOST_PORT:-29092}:29092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - verdict_local
    mem_limit: ${KAFKA_MAX_MEMORY:-768m}
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server 127.0.0.1:9092 >/dev/null 2>&1
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  object-store:
    build:
      context: https://github.com/minio/minio.git#RELEASE.2025-10-15T17-29-55Z
      dockerfile_inline: |
        FROM golang:1.24-alpine3.23 AS build
        WORKDIR /src
        COPY . .
        RUN go build -trimpath -o /minio .
        FROM alpine:3.23
        RUN apk add --no-cache ca-certificates wget
        COPY --from=build /minio /usr/bin/minio
        EXPOSE 9000 9001
        ENTRYPOINT ["minio"]
    restart: unless-stopped
    environment:
      TZ: UTC
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command:
      - server
      - /data
      - --console-address
      - ":9001"
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    networks:
      - verdict_local
    mem_limit: ${MINIO_MAX_MEMORY:-512m}
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q --spider http://127.0.0.1:9000/minio/health/live
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  object-bootstrap:
    build:
      context: https://github.com/minio/mc.git#RELEASE.2025-08-13T08-35-41Z
      dockerfile_inline: |
        FROM golang:1.24-alpine3.23 AS build
        WORKDIR /src
        COPY . .
        RUN go build -trimpath -o /mc .
        FROM alpine:3.23
        RUN apk add --no-cache ca-certificates
        COPY --from=build /mc /usr/bin/mc
        ENTRYPOINT ["mc"]
    profiles:
      - bootstrap
    environment:
      TZ: UTC
      MC_HOST_local: http://${MINIO_ROOT_USER}:${MINIO_ROOT_PASSWORD}@object-store:9000
    networks:
      - verdict_local
    restart: "no"
    depends_on:
      object-store:
        condition: service_healthy

networks:
  verdict_local:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  kafka_data:
  minio_data:
