[project]
name = "verdict-model-service"
version = "0.1.0"
description = "VERDICT model inference service"
requires-python = ">=3.13,<3.14"
dependencies = []

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/verdict_model_service"]

[dependency-groups]
dev = [
  "ruff==0.17.6",
  "mypy==2.4.1",
  "pytest==9.2.0",
  "hypothesis==6.170.17",
]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "B",
  "BLE",
  "UP",
  "S",
  "DTZ",
  "T20",
  "PT",
  "SIM",
  "C4",
  "PERF",
  "RUF",
  "N",
  "ANN",
  "ARG",
  "ERA",
  "TID",
]

[tool.ruff.lint.per-file-ignores]
# Pytest assertions are the test contract; they are never runtime application code.
"tests/*.py" = ["S101"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"pickle" = { msg = "Pickle deserialization is prohibited by CS-P-12." }
"cloudpickle" = { msg = "Cloudpickle deserialization is prohibited by CS-P-12." }
"marshal" = { msg = "Marshal deserialization is prohibited by CS-P-12." }
"shelve" = { msg = "Shelve deserialization is prohibited by CS-P-12." }

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = ["src"]

[tool.pytest.ini_options]
markers = [
  "unit: fast isolated tests",
  "integration: tests that exercise real project boundaries",
  "slow: intentionally slow tests excluded from the default run",
]
